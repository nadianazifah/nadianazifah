<!DOCTYPE html>
<html>
<head>
<title>CakeLib - Digital Cake Library</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
margin:0;
font-family:'Poppins',sans-serif;
background:#fffaf4;
color:#4b3b1f;
}

/* NAVBAR */
.navbar{
background:white;
padding:15px 40px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
position:sticky;
top:0;
z-index:1000;
}

.navbar a{
margin-left:15px;
cursor:pointer;
text-decoration:none;
color:#6b5b2a;
font-weight:500;
}

.navbar a:hover{
color:#f4c542;
}

.nav-btn{
background:#f4c542;
color:white;
padding:8px 15px;
border-radius:20px;
}

/* HERO */
.hero{
text-align:center;
padding:100px 20px;
background:linear-gradient(to right,#ffe9b0,#ffd36b);
}

.search-box input{
padding:12px;
border-radius:20px;
border:none;
width:250px;
margin-top:15px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

/* FITUR */
.fitur{
display:flex;
justify-content:center;
gap:20px;
margin-top:40px;
flex-wrap:wrap;
}

.fitur-box{
background:white;
padding:20px;
border-radius:15px;
width:200px;
text-align:center;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.fitur-box i{
font-size:30px;
color:#f4c542;
}

/* CARD */
.collection{
display:flex;
gap:20px;
justify-content:center;
flex-wrap:wrap;
margin-top:20px;
}

.card{
width:220px;
background:white;
border-radius:20px;
padding:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
transition:0.3s;
}

.card:hover{
transform:translateY(-10px) scale(1.03);
}

.card img{
width:100%;
border-radius:15px;
height:140px;
object-fit:cover;
}

/* EVENT */
.event{
display:flex;
gap:20px;
justify-content:center;
flex-wrap:wrap;
margin-top:50px;
}

.event-card{
width:260px;
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.event-card img{
width:100%;
height:160px;
object-fit:cover;
}

/* KATEGORI */
.kategori-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:20px;
padding:20px;
}

.kategori-item{
position:relative;
border-radius:15px;
overflow:hidden;
}

.kategori-item img{
width:100%;
height:140px;
object-fit:cover;
}

.kategori-item span{
position:absolute;
bottom:10px;
left:10px;
background:white;
padding:5px 10px;
border-radius:10px;
}

/* PAGE */
.page{
display:none;
padding:60px;
text-align:center;
}

/* KALKULATOR */
.kalkulator input{
margin:5px;
padding:10px;
}

</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
<div><b>🎂 CakeLib</b></div>
<div>
<a onclick="showPage('home')">Beranda</a>
<a onclick="showPage('koleksi')">Koleksi</a>
<a onclick="showPage('kalkulator')">Kalkulator</a>
<a onclick="showPage('login')" class="nav-btn">Login</a>
</div>
</div>

<!-- HOME -->
<div id="homePage">

<div class="hero">
<h1>Selamat Datang di CakeLib 🎂</h1>
<p>🔥 100+ Resep | 🎥 Video Tutorial | 👩‍🍳 Komunitas Baking</p>
</div>

<!-- FITUR -->
<div class="fitur">
<div class="fitur-box"><i class="fas fa-book"></i><p>Resep</p></div>
<div class="fitur-box"><i class="fas fa-video"></i><p>Video</p></div>
<div class="fitur-box"><i class="fas fa-users"></i><p>Komunitas</p></div>
</div>

<!-- KOLEKSI -->
<h2 align="center">✨ Koleksi</h2>
<div class="collection">
<div class="card"><img src="cookiess.jpg"><h3>Cookies</h3></div>
<div class="card"><img src="birthdaycake.jpg"><h3>Birthday Cake</h3></div>
<div class="card"><img src="cheese cake.jpg"><h3>Cheesecake</h3></div>
</div>

<!-- EVENT -->
<h2 align="center">🎉 Event</h2>
<div class="event">
<div class="event-card"><img src="cookiess.jpg"></div>
<div class="event-card"><img src="birthdaycake.jpg"></div>
</div>

<!-- KATEGORI -->
<h2 align="center">🍰 Kategori</h2>
<div class="kategori-grid">
<div class="kategori-item"><img src="cookiess.jpg"><span>Cookies</span></div>
<div class="kategori-item"><img src="birthdaycake.jpg"><span>Cake</span></div>
</div>

</div>

<!-- KOLEKSI PAGE -->
<div id="koleksiPage" class="page">
<h2>Koleksi Lengkap</h2>
<p>Isi koleksi di sini</p>
</div>

<!-- KALKULATOR -->
<div id="kalkulatorPage" class="page">
<h2>Kalkulator</h2>

<div class="kalkulator">
<input type="number" id="a" placeholder="Angka 1">
<input type="number" id="b" placeholder="Angka 2"><br>

<button onclick="hitung('+')">+</button>
<button onclick="hitung('-')">-</button>

<h3 id="hasil"></h3>
</div>

</div>

<!-- LOGIN -->
<div id="loginPage" class="page">
<h2>Login</h2>
<input id="username"><br><br>
<input id="password" type="password"><br><br>
<button onclick="login()">Login</button>
<p id="pesanLogin"></p>
</div>

<script>

function showPage(page){
document.querySelectorAll('.page,#homePage').forEach(el=>el.style.display="none");
document.getElementById(page+"Page").style.display="block";
}

function hitung(op){
let a=parseFloat(document.getElementById("a").value);
let b=parseFloat(document.getElementById("b").value);
hasil.innerText = op==="+" ? a+b : a-b;
}

function login(){
pesanLogin.innerText="Login berhasil!";
}

showPage('home');

</script>

</body>
</html>
